# Nginx config for vastraaverse.in
# Deploy to: /etc/nginx/sites-available/vastra-verse
# Enable: sudo ln -sf /etc/nginx/sites-available/vastra-verse /etc/nginx/sites-enabled/vastra-verse
# Test:   sudo nginx -t
# Reload: sudo systemctl reload nginx

# Rate limiting zones (define at http level — place in nginx.conf or sites-available)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=120r/m;

# Upstream — PM2 cluster on port 3000 with keepalive
upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name vastraaverse.in www.vastraaverse.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vastraaverse.in www.vastraaverse.in;

    # SSL — Certbot-managed
    ssl_certificate     /etc/letsencrypt/live/vastraaverse.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vastraaverse.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security Headers (supplement Next.js headers) ─────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Proxy defaults ────────────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ── Next.js static assets — served directly by Nginx (no Node.js hop) ────
    # These are content-hashed so they can be cached forever.
    location /_next/static/ {
        alias /home/ubuntu/vastra-verse/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        # Gzip pre-compressed files if available
        gzip_static on;
    }

    # ── Public folder assets ──────────────────────────────────────────────────
    location /public/ {
        alias /home/ubuntu/vastra-verse/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        gzip_static on;
    }

    # ── Favicon/robots/sitemap — short cache, allow revalidation ─────────────
    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
        proxy_pass http://nextjs;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ── Next.js image optimization ────────────────────────────────────────────
    location /_next/image {
        proxy_pass http://nextjs;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # ── API routes — rate limited, never cached ───────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://nextjs;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
    }

    # ── Health check — no rate limit, no cache ────────────────────────────────
    location /api/health {
        proxy_pass http://nextjs;
        add_header Cache-Control "no-store";
        access_log off;
    }

    # ── All other pages → Next.js ─────────────────────────────────────────────
    location / {
        limit_req zone=general_limit burst=30 nodelay;
        proxy_pass http://nextjs;
    }

    # ── Block common attack vectors ───────────────────────────────────────────
    location ~* \.(php|asp|aspx|jsp)$ {
        return 404;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/vastra-verse.access.log combined buffer=512k flush=5m;
    error_log  /var/log/nginx/vastra-verse.error.log warn;

    # ── Client body size (for uploads) ───────────────────────────────────────
    client_max_body_size 50M;
}
