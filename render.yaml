## ============================================================
## Render Blueprint — Vastra-Verse
## Docs: https://render.com/docs/blueprint-spec
## ============================================================
##
## Services defined here:
##   1. vastra-verse-web    — Next.js web app  (Node 20, port 3000)
##   2. vastra-verse-worker — BullMQ background worker (Node 20)
##
## How to deploy:
##   1. Push this file to your GitHub repo (root level)
##   2. Go to https://dashboard.render.com → New → Blueprint
##   3. Connect your repo → Render auto-detects render.yaml
##   4. Fill in the secret env vars marked "sync: false"
##   5. Click "Apply" — both services deploy automatically
##
## NOTE: All env vars marked "sync: false" must be set manually
##       in the Render dashboard (Environment tab per service).
##       They are intentionally left blank here for security.
## ============================================================

services:

  # ── 1. Web Service (Next.js) ──────────────────────────────────────────────
  - type: web
    name: vastra-verse-web
    runtime: node
    region: singapore          # Closest to your South-East Asia user base
    plan: starter              # Upgrade to "standard" for production scale
    branch: main
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true           # Auto-deploy on every push to `main`

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      # ── Database (Supabase / Postgres) ─────────────────────────────────────
      - key: DATABASE_URL
        sync: false            # Set in Render dashboard → Environment

      - key: DIRECT_URL
        sync: false

      # ── Auth ───────────────────────────────────────────────────────────────
      - key: NEXTAUTH_SECRET
        generateValue: true    # Render auto-generates a secure random value

      - key: AUTH_SECRET
        sync: false            # Must match NEXTAUTH_SECRET — set manually

      - key: NEXTAUTH_URL
        sync: false            # e.g. https://vastra-verse.onrender.com

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # ── Razorpay Payment Gateway ────────────────────────────────────────────
      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ── Cloudinary (Image Storage) ──────────────────────────────────────────
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Supabase Storage ────────────────────────────────────────────────────
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false

      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── Redis (Upstash) ─────────────────────────────────────────────────────
      - key: UPSTASH_REDIS_REST_URL
        sync: false

      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ── Email ───────────────────────────────────────────────────────────────
      - key: EMAIL_USER
        sync: false

      - key: EMAIL_PASS
        sync: false

      # ── Admin ───────────────────────────────────────────────────────────────
      - key: ADMIN_EMAIL
        sync: false

      # ── MSG91 OTP ──────────────────────────────────────────────────────────
      - key: MSG91_AUTH_KEY
        sync: false

      - key: MSG91_SENDER_ID
        sync: false

      - key: NEXT_PUBLIC_MSG91_WIDGET_ID
        sync: false

      - key: NEXT_PUBLIC_MSG91_TOKEN_AUTH
        sync: false

      # ── Sentry (Error Monitoring) ───────────────────────────────────────────
      - key: SENTRY_DSN
        sync: false

      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false

      - key: SENTRY_AUTH_TOKEN
        sync: false

      - key: SENTRY_ORG
        sync: false

      - key: SENTRY_PROJECT
        sync: false

      - key: SENTRY_ENVIRONMENT
        value: production

      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"           # 10% sampling in production to control quota

      # ── Shiprocket Shipping ─────────────────────────────────────────────────
      - key: SHIPROCKET_EMAIL
        sync: false

      - key: SHIPROCKET_PASSWORD
        sync: false

      - key: SHIPROCKET_BASE_URL
        value: https://apiv2.shiprocket.in/v1/external

      - key: SHIPROCKET_WEBHOOK_SECRET
        sync: false

      - key: SHIPROCKET_PICKUP_LOCATION
        sync: false

      - key: SHIPROCKET_PICKUP_PINCODE
        sync: false

      # ── Cron Security ──────────────────────────────────────────────────────
      - key: CRON_SECRET
        generateValue: true    # Used to secure /api/cron/* endpoints

  # ── 2. Background Worker Service (BullMQ) ────────────────────────────────
  - type: worker
    name: vastra-verse-worker
    runtime: node
    region: singapore
    plan: starter
    branch: main
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run worker
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # ── Database ────────────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      # ── Redis ───────────────────────────────────────────────────────────────
      - key: UPSTASH_REDIS_REST_URL
        sync: false

      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ── Email (worker sends transactional emails) ───────────────────────────
      - key: EMAIL_USER
        sync: false

      - key: EMAIL_PASS
        sync: false

      # ── Razorpay (refund worker) ────────────────────────────────────────────
      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      # ── Cloudinary (invoice/image worker) ──────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── Sentry ──────────────────────────────────────────────────────────────
      - key: SENTRY_DSN
        sync: false

      - key: SENTRY_ENVIRONMENT
        value: production
