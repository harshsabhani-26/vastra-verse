# ============================================================
# RAILWAY WORKER CONFIG — COMMENTED OUT (Switched to Vercel)
# ============================================================
# Vastra-Verse — Background Worker Service
# This was for a SEPARATE Railway service (not the web service).
#
# If switching back to Railway:
# 1. In Railway dashboard → "New Service" → "GitHub Repo"
# 2. Select same repo
# 3. Set "Config File Path" to: railway-worker.toml
# 4. Copy all environment variables from the web service
# 5. Deploy — the worker runs independently of the web server
#
# For Vercel: Use Vercel Cron Jobs or an external worker service
# (e.g. Render, Fly.io, or a standalone Node process) for BullMQ workers.
# Critical worker env vars needed:
#   DATABASE_URL, DIRECT_URL
#   UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN
#   EMAIL_USER, EMAIL_PASS
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
#
# [deploy]
# startCommand = "npm run worker"
# restartPolicyType = "ON_FAILURE"
# restartPolicyMaxRetries = 20  # Workers should always restart
# numReplicas = 1               # 1 worker replica is sufficient initially
#
# [build]
# buildCommand = "npx prisma generate && npm run build"
#
# [environment]
# NODE_ENV = "production"
