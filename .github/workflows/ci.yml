name: CI — Build, Type Check & Deploy (Render)

# Render auto-deploys on every push to main via GitHub integration.
# This workflow only validates the build — Render handles the actual deployment.

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Type Check
        run: npx tsc --noEmit --pretty
        continue-on-error: false

      - name: Lint Check
        run: npx next lint
        continue-on-error: true

      - name: Build Application
        run: npm run build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Build Success
        if: success()
        run: echo "✅ Build verified — Render will auto-deploy from GitHub on push to main."

  # ── Render Deploy Notification ────────────────────────────────────────────
  # Render deploys automatically via GitHub webhook — no SSH/secrets needed.
  # Monitor your deploy at: https://dashboard.render.com
